
workflows:
  ios-simulator:
    name: Tap Rush 2.0 - iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS Simulator app
        script: |
          flutter build ios --simulator --debug

      - name: Package simulator app
        script: |
          cd build/ios/iphonesimulator
          zip -r "$CM_BUILD_DIR/Runner-simulator.app.zip" Runner.app

    artifacts:
      - Runner-simulator.app.zip
